name: Bottle

on:
  repository_dispatch:
    types: [bottle]

permissions:
  contents: write

jobs:
  bottle:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.client_payload.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig
        run: brew install zig

      - name: Prepare source info
        run: |
          VERSION="${TAG#v}"
          SOURCE_URL="https://github.com/bobrwm/bobrwm/archive/refs/tags/${TAG}.tar.gz"
          curl -sL "$SOURCE_URL" -o /tmp/source.tar.gz
          SOURCE_SHA256=$(shasum -a 256 /tmp/source.tar.gz | cut -d' ' -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_URL=$SOURCE_URL" >> "$GITHUB_ENV"
          echo "SOURCE_SHA256=$SOURCE_SHA256" >> "$GITHUB_ENV"

      - name: Generate temporary formula for bottling
        run: |
          mkdir -p /tmp/tap/Formula
          sed -e "s|%%SOURCE_URL%%|$SOURCE_URL|" \
              -e "s|%%SOURCE_SHA256%%|$SOURCE_SHA256|" \
              -e "s|%%TAG%%|$TAG|" \
              -e '/bottle do/,/^  end/d' \
              .github/formula.rb.tpl > /tmp/tap/Formula/bobrwm.rb
          cat /tmp/tap/Formula/bobrwm.rb

      - name: Build and bottle
        run: |
          brew install --build-bottle /tmp/tap/Formula/bobrwm.rb
          mkdir -p /tmp/bottles
          cd /tmp/bottles
          brew bottle --json \
            --root-url "https://github.com/bobrwm/bobrwm/releases/download/${TAG}" \
            /tmp/tap/Formula/bobrwm.rb

          BOTTLE_FILE=$(ls /tmp/bottles/*.bottle.tar.gz)
          BOTTLE_JSON=$(cat /tmp/bottles/*.bottle.json)

          # Parse bottle metadata with ruby (always available on Homebrew runners)
          eval "$(echo "$BOTTLE_JSON" | ruby -rjson -e '
            d = JSON.parse(STDIN.read)
            tags = d[d.keys.first]["bottle"]["tags"]
            tag = tags.keys.first
            puts "PLATFORM=#{tag}"
            puts "CELLAR=#{tags[tag]["cellar"]}"
            puts "BOTTLE_SHA256=#{tags[tag]["sha256"]}"
          ')"

          echo "BOTTLE_FILE=$BOTTLE_FILE" >> "$GITHUB_ENV"
          echo "PLATFORM=$PLATFORM" >> "$GITHUB_ENV"
          echo "CELLAR=$CELLAR" >> "$GITHUB_ENV"
          echo "BOTTLE_SHA256=$BOTTLE_SHA256" >> "$GITHUB_ENV"

      - name: Upload bottle to bobrwm release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh release upload "$TAG" "$BOTTLE_FILE" --repo bobrwm/bobrwm

      - name: Snapshot previous version
        run: |
          PREV_VERSION=$(sed -n 's|.*archive/refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)\.tar\.gz.*|\1|p' Formula/bobrwm.rb | head -1)

          if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$VERSION" ]; then
            VERSIONED_FILE="Formula/bobrwm@${PREV_VERSION}.rb"

            if [ ! -f "$VERSIONED_FILE" ]; then
              cp Formula/bobrwm.rb "$VERSIONED_FILE"

              VERSIONED_CLASS="BobrwmAT$(echo "$PREV_VERSION" | tr '.' '_')"
              sed -i '' -e "s/class Bobrwm </class ${VERSIONED_CLASS} </" \
                        -e '/^  head /d' \
                        -e '/depends_on "zig"/a\'$'\n''  keg_only :versioned_formula' \
                        "$VERSIONED_FILE"

              echo "Created $VERSIONED_FILE"
            fi
          fi

      - name: Update main formula
        run: |
          if echo "$CELLAR" | grep -q '^:'; then
            CELLAR_STR="cellar: ${CELLAR}, "
          else
            CELLAR_STR="cellar: \"${CELLAR}\", "
          fi

          sed -e "s|%%SOURCE_URL%%|$SOURCE_URL|" \
              -e "s|%%SOURCE_SHA256%%|$SOURCE_SHA256|" \
              -e "s|%%TAG%%|$TAG|" \
              -e "s|%%CELLAR_STR%%|$CELLAR_STR|" \
              -e "s|%%PLATFORM%%|$PLATFORM|" \
              -e "s|%%BOTTLE_SHA256%%|$BOTTLE_SHA256|" \
              .github/formula.rb.tpl > Formula/bobrwm.rb
          cat Formula/bobrwm.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "bobrwm ${TAG}"
          git push
