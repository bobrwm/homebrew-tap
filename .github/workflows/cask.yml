name: Cask

on:
  repository_dispatch:
    types: [cask]

permissions:
  contents: write

concurrency:
  group: cask
  cancel-in-progress: false

jobs:
  cask:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      VERSION: ${{ github.event.client_payload.version }}
      ARTIFACT: ${{ github.event.client_payload.artifact }}
      ARTIFACT_SHA256: ${{ github.event.client_payload.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Update cask
        run: python3 script/update-cask.py

      - name: Verify artifact
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/bobrwm/bobrwm/releases/download/tip/$ARTIFACT" \
            --output "$RUNNER_TEMP/$ARTIFACT"
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$RUNNER_TEMP/$ARTIFACT" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/$ARTIFACT" "$RUNNER_TEMP/bobrwm"
          codesign --verify --deep --strict "$RUNNER_TEMP/bobrwm/Bobrwm.app"
          xcrun stapler validate "$RUNNER_TEMP/bobrwm/Bobrwm.app"

      - name: Verify cask
        run: |
          ruby -c Casks/bobrwm.rb
          mkdir -p "$(brew --repository)/Library/Taps/bobrwm"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/bobrwm/homebrew-tap"
          brew trust bobrwm/tap
          brew install --cask bobrwm/tap/bobrwm
          bobrwm --version
          codesign --verify --deep --strict /Applications/Bobrwm.app
          xcrun stapler validate /Applications/Bobrwm.app

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/bobrwm.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore(cask): update bobrwm to ${VERSION}"
          git push
